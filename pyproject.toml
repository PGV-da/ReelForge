[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ReelForge"
version = "1.0.0"
description = "Telegram-controlled Instagram Reels repurposing & publishing bot"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "ReelForge Team" }]
dependencies = [
    "aiogram>=3.13.0,<4.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "yt-dlp>=2024.1.0",
    "faster-whisper>=1.0.0",
    "httpx>=0.27.0,<1.0",
    "loguru>=0.7.0,<1.0",
    "aiosqlite>=0.20.0",
    "aiofiles>=24.1.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0.0"]
dev = ["ruff>=0.5.0", "mypy>=1.10", "pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
