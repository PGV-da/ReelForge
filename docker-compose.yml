version: "3.9"

services:
  # ── ReelForge Telegram Bot ────────────────────
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ReelForge
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persistent temp storage (optional, useful for debugging)
      - reelforge-tmp:/tmp/reelforge
      # Mount cookies file if needed for yt-dlp
      # - ./cookies.txt:/opt/reelforge/cookies.txt:ro
      # Mount custom fonts
      - ./assets/fonts:/opt/reelforge/assets/fonts:ro
    depends_on:
      - redis
    environment:
      # Override to use Redis for FSM state persistence
      - REDIS_URL=redis://redis:6379/0
    networks:
      - reelforge-net

  # ── Redis (FSM State & Job Tracking) ──────────
  redis:
    image: redis:7-alpine
    container_name: reelforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reelforge-net

volumes:
  reelforge-tmp:
  redis-data:

networks:
  reelforge-net:
    driver: bridge
